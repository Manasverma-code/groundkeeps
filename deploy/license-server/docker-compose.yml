services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - LICENSE_DOMAIN=${LICENSE_DOMAIN:-license.groundkeeps.in}
      - EMAIL=${EMAIL:-admin@groundkeeps.in}
    depends_on:
      - license-server

  license-server:
    build:
      context: ../../
      dockerfile: deploy/license-server/Dockerfile
    restart: unless-stopped
    expose:
      - "3001"
    env_file:
      - .env
    volumes:
      - license_data:/app/data

volumes:
  caddy_data:
  caddy_config:
  license_data:
