global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "groundkeeps-proxy"
    static_configs:
      - targets:
          - "trust-proxy:3000"
    metrics_path: /v1/metrics
    scheme: http
