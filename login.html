<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to Ground Keeps." />
    <title>Sign in — Ground Keeps</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" crossorigin href="/assets/index-Da4P4kFb.css">
    <style>
      .login-section {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: calc(100vh - 80px);
        padding: 4rem 2rem;
      }
      .login-card {
        width: 100%;
        max-width: 400px;
      }
      .login-card h3 {
        text-align: center;
        margin-bottom: 0.25rem;
      }
      .login-card .subtitle {
        margin-bottom: 2rem;
      }
      .form-group {
        margin-bottom: 1.25rem;
      }
      .form-group label {
        display: block;
        color: var(--text-secondary);
        font-size: 0.85rem;
        font-weight: 500;
        margin-bottom: 0.4rem;
      }
      .form-group input {
        width: 100%;
        background: var(--bg-color);
        border: 1px solid var(--border-light);
        border-radius: 8px;
        padding: 0.75rem 1rem;
        color: var(--text-primary);
        font-size: 0.95rem;
        font-family: var(--font-sans);
        outline: none;
        transition: border-color 0.2s;
      }
      .form-group input:focus {
        border-color: var(--accent-primary);
      }
      .form-actions {
        margin-top: 1.5rem;
      }
      .form-actions .btn {
        width: 100%;
        justify-content: center;
      }
      .form-footer {
        text-align: center;
        margin-top: 1.5rem;
        color: var(--text-muted);
        font-size: 0.85rem;
      }
      .form-footer a {
        color: var(--text-secondary);
        text-decoration: none;
      }
      .form-footer a:hover {
        color: var(--text-primary);
      }
      .divider {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin: 1.5rem 0;
        color: var(--text-muted);
        font-size: 0.8rem;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border-light);
      }
      .social-btn {
        width: 100%;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header class="navbar">
        <div class="nav-container">
          <a href="/" class="logo" style="text-decoration:none">
            <svg width="24" height="24" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" class="icon">
              <path d="M 75 25 A 35 35 0 1 0 75 75" />
              <path d="M 45 50 L 75 50" />
              <path d="M 60 50 L 75 65" />
            </svg>
            GroundKeeps
          </a>
          <div class="nav-right">
            <a href="/" class="nav-link">Home</a>
            <a href="login.html" class="btn btn-primary btn-sm btn-pill">Sign in</a>
          </div>
        </div>
      </header>

      <section class="login-section">
        <div class="login-card glass-card">
          <h3>Welcome back</h3>
          <p class="subtitle" style="font-size:0.95rem">Sign in to your Ground Keeps account.</p>

          <form onsubmit="return false">
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary btn-pill">Sign in</button>
            </div>
          </form>

          <div class="divider">or continue with</div>

          <a href="#" class="btn btn-outline btn-pill social-btn">GitHub</a>

          <div class="form-footer">
            Don't have an account? <a href="#pricing">Start free</a>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
