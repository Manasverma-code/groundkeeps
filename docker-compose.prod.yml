services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - DOMAIN=${DOMAIN}
      - EMAIL=${EMAIL}

  trust-proxy:
    build:
      context: .
      target: proxy
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - PROXY_PORT=3000
      - PROXY_API_KEY=${PROXY_API_KEY}
      - TARGET_LLM_PROVIDER=${TARGET_LLM_PROVIDER:-groq}
      - TARGET_LLM_API_KEY=${TARGET_LLM_API_KEY}
      - TARGET_LLM_MODEL=${TARGET_LLM_MODEL}
      - VERIFIER_LLM_PROVIDER=${VERIFIER_LLM_PROVIDER:-groq}
      - VERIFIER_LLM_API_KEY=${VERIFIER_LLM_API_KEY}
      - VERIFIER_LLM_MODEL=${VERIFIER_LLM_MODEL}
      - AUDIT_DB_PATH=${AUDIT_DB_PATH:-/data/audit.db}
      - GUARD_DB_PATH=${GUARD_DB_PATH:-/data/guard.json}
      - DEFAULT_AGENT_ID=${DEFAULT_AGENT_ID:-default}
    volumes:
      - audit-data:/data
    depends_on:
      - caddy

volumes:
  caddy-data:
  caddy-config:
  audit-data:
