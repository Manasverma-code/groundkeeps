services:
  trust-proxy:
    build:
      context: .
      target: proxy
    ports:
      - "3000:3000"
    environment:
      - PROXY_PORT=3000
      - TARGET_LLM_PROVIDER=${TARGET_LLM_PROVIDER:-ollama}
      - TARGET_LLM_API_KEY=${TARGET_LLM_API_KEY:-}
      - TARGET_LLM_MODEL=${TARGET_LLM_MODEL:-llama3.2}
      - TARGET_LLM_BASE_URL=${TARGET_LLM_BASE_URL:-}
      - VERIFIER_LLM_PROVIDER=${VERIFIER_LLM_PROVIDER:-ollama}
      - VERIFIER_LLM_API_KEY=${VERIFIER_LLM_API_KEY:-}
      - VERIFIER_LLM_MODEL=${VERIFIER_LLM_MODEL:-llama3.2}
      - AUDIT_DB_PATH=/data/audit.db
      - GUARD_DB_PATH=/data/guard.json
      - DEFAULT_AGENT_ID=default
    volumes:
      - audit-data:/data



volumes:
  audit-data:
